[package]
name = "tishlang_apple_common"
version = "0.1.0"
edition = "2021"
description = "Shared tag/style/handler helpers for tish-macos and tish-ios"
license = "MIT"
repository = "https://github.com/tishlang/tish-apple"

[dependencies]
tishlang_core = { path = "../../../tish/crates/tish_core" }
tishlang_ui = { path = "../../../tish/crates/tish_ui", default-features = false, features = ["runtime"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = true }

[target.'cfg(target_os = "ios")'.dependencies]
objc2 = { version = "0.6", default-features = true }
objc2-ui-kit = { version = "0.3", default-features = true, features = ["UIView", "UIColor"] }
