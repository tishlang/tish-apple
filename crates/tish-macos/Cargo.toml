[package]
name = "tish-macos"
version = "0.1.0"
edition = "2021"
description = "AppKit native window + tishlang_ui Host for Tish JSX (macOS)"
license = "MIT"
repository = "https://github.com/tishlang/tish-apple"

[dependencies]
tish-apple-common = { path = "../tish-apple-common" }
tishlang_core = { path = "../../../tish/crates/tish_core" }
tishlang_ui = { path = "../../../tish/crates/tish_ui", default-features = false, features = ["runtime"] }
tishlang_runtime = { path = "../../../tish/crates/tish_runtime" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", default-features = true }
objc2-foundation = { version = "0.3", default-features = true, features = [
    "NSDate",
    "NSTimer",
    "NSData",
    "NSString",
    "NSError",
    "block2",
] }
block2 = "0.6"
serde_json = "1"
objc2-app-kit = { version = "0.3", default-features = true, features = [
    "objc2-quartz-core",
    "NSVisualEffectView",
    "NSTextView",
    "NSText",
    "NSResponder",
    "NSAppearance",
    "NSToolbar",
    "NSScreen",
    "NSSound",
    "NSUserInterfaceItemIdentification",
] }
objc2-core-foundation = { version = "0.3", default-features = true, features = [
    "CFNotificationCenter",
    "CFDictionary",
    "CFString",
] }
objc2-quartz-core = { version = "0.3", default-features = false, features = [
    "CALayer",
    "objc2-core-foundation",
    "objc2-core-graphics",
] }
objc2-web-kit = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "objc2-app-kit",
    "objc2-core-foundation",
    "WKWebView",
    "WKWebViewConfiguration",
    "WKNavigation",
    "WKNavigationDelegate",
    "WKUIDelegate",
    "WKUserContentController",
    "WKUserScript",
    "WKScriptMessage",
    "WKScriptMessageHandler",
] }
dispatch2 = "0.3"
objc2-user-notifications = { version = "0.3", default-features = true }
